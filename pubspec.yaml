name: stock_arena
description: A gamified paper-trading Flutter app with virtual stocks, charts, missions, badges, and leaderboards.
publish_to: "none"

version: 1.0.3+4

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  fl_chart: ^1.2.0
  google_fonts: ^8.1.0
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2
  yahoo_finance_data_reader: ^1.0.14
  syncfusion_flutter_charts: ^33.2.10
  google_sign_in: 6.2.1
  cloud_firestore: ^6.5.0
  web_socket_channel: ^3.0.3
  http: ^1.6.0
  url_launcher: ^6.3.2
  animated_list_plus: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon.png"

